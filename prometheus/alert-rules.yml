groups:
  - name: agent-api-alerts
    rules:
      - alert: AgentAPIDown
        expr: up{job="agent-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Agent API is down"
          description: "The agent API has been unreachable for more than 1 minute."

      # 2x the ~15% baseline observed via Prometheus.
      - alert: HighRejectionRate
        expr: |
          sum(rate(agent_rejections_total[5m])) / sum(rate(agent_requests_total{route="/ask"}[5m])) > 0.30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Rejection rate sustained above 30% for 10+ minutes"
          description: "Current rejection rate is {{ $value | humanizePercentage }} (baseline ~15%). Check agent_rejections_total by reason to see which category is driving it."

      # 5m rate vs 30m trailing baseline (3x), floor avoids low-volume noise.
      - alert: RejectionRateSpike
        expr: |
          (sum(rate(agent_rejections_total[5m])) / sum(rate(agent_requests_total{route="/ask"}[5m])))
          > 3 * (sum(rate(agent_rejections_total[30m])) / sum(rate(agent_requests_total{route="/ask"}[30m])))
          and sum(rate(agent_rejections_total[5m])) / sum(rate(agent_requests_total{route="/ask"}[5m])) > 0.10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Rejection rate is 3x+ the 30m trailing baseline"
          description: "5m rejection rate is {{ $value | humanizePercentage }}, over 3x the trailing 30m average. Could mean an attack attempt or a bad deploy. Check agent_rejections_total by reason and recent commits."
